<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Portfolio</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/ScrollTrigger.min.js"></script>
</head>
<body>
    <div class="custom-cursor"></div>
    
    <canvas id="three-canvas"></canvas>

    <div class="scroll-container">
        <!-- Hero Section -->
        <section class="fullscreen-section hero">
            <div class="content">
                <h1 class="hero-title"></h1>
                <div class="sphere-interactive"></div>
            </div>
        </section>

        <!-- Projects Section -->
        <section class="fullscreen-section projects">
            <div class="section-header">
                <h2>Projects</h2>
            </div>
            <div class="projects-grid"></div>
        </section>

        <!-- Resume Section -->
        <section class="fullscreen-section resume">
            <div class="timeline-container"></div>
        </section>

        <!-- Contact Section -->
        <section class="fullscreen-section contact">
            <div class="contact-form">
                <!-- Form elements -->
            </div>
        </section>
    </div>

    <script type="module" src="./assets/js/main.js"></script>
</body>
</html>

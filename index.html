<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced 3D Portfolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body data-scroll-container>
    <!-- Custom Cursor -->
    <div class="cursor">
        <div class="cursor__inner"></div>
    </div>

    <!-- 3D Canvas -->
    <canvas class="webgl"></canvas>

    <!-- Sections -->
    <main class="smooth-scroll">
        <section class="hero" data-scroll-section>
            <div class="hero__content">
                <h1 class="hero__title" data-splitting>Creative Developer</h1>
                <div class="hero__marquee" data-scroll data-scroll-speed="1">
                    <span>3D ARTIST — WEB DEVELOPER — VISUAL DESIGNER</span>
                </div>
            </div>
        </section>

        <section class="projects" data-scroll-section>
            <div class="projects__header">
                <h2 data-scroll data-scroll-speed="0.5">Selected Works</h2>
            </div>
            <div class="projects__grid"></div>
        </section>

        <!-- More sections -->
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/splitting/dist/splitting.min.js"></script>
    <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
